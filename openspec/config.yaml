schema: spec-driven

context: |
  worksmobile-message-botはBun + TypeScript + Honoで構成するLINE WORKS Bot APIの薄いラッパー。
  長期的な技術判断はdocs/adr/、全Agent共通ルールはAGENTS.md、
  現在の構成はREADME.mdとCONTEXT.md、実行可能な仕様はテストコードをSoTとする。
  OpenSpecは今回の変更要求をchanges/*/specs/、実装方針をdesign.md、
  実装手順をtasks.mdで管理し、既存のSoTを置き換えない。
  HTTP API contract、入力validation、保存条件・状態遷移・不変条件、
  認証・認可境界、callbackや外部API連携の観測可能な挙動を変える変更に使う。
  既存仕様を一括 backfill しない。

rules:
  proposal:
    - 既存のADR、AGENTS.md、README.md、CONTEXT.mdを参照し、内容や判断理由を複製しない
    - 挙動不変のrefactor、依存関係だけの更新、typo修正が対象外であることを明記する
  specs:
    - テスト可能な要求とscenarioだけを書き、既存仕様の全量を転記しない
  design:
    - 今回の実装方針だけを書き、長期的な技術判断はADRを参照または同じ変更単位で起票する
  tasks:
    - テストと実装を別phaseにせず、各項目をred→green→refactor/verifyの縦スライスにする
