commit-msg:
  commands:
    # attribution trailer は AGENTS.md §7.1 で禁止。harness の session 開始指示が
    # 毎回これを足すため、規約を読んでいても守り切れない (2026-09-09 に 49 件の違反)。
    # 規律ではなく機械で止める。正本は agent-room の lefthook.yml。
    forbidden-trailers:
      run: |
        if grep -qiE '^(Co-Authored-By|Claude-Session):' {1}; then
          echo "commit-msg: 禁止 trailer が含まれています (AGENTS.md §7.1)" >&2
          echo "  削除する行: Co-Authored-By: / Claude-Session: の両方" >&2
          grep -inE '^(Co-Authored-By|Claude-Session):' {1} | sed 's/^/  検出 /' >&2
          exit 1
        fi

post-merge:
  commands:
# <!-- BEGIN develop-tools:lefthook:post-merge:graphify-refresh v1 sha256=0b0949ab61236fe8c4a36cac738cd391ddd0f4e11600804093557645819cd1cd -->
    graphify-refresh:
      run: |
        refresher="$HOME/Develop/develop-meta/bin/graphify-refresh"
        if [ ! -x "$refresher" ]; then
          printf '%s\n' 'graphify-refresh: binary missing or not executable' >&2
        elif ! "$refresher" --repo-root .; then
          printf '%s\n' 'graphify-refresh: refresh failed' >&2
        fi
        true
# <!-- END develop-tools:lefthook:post-merge:graphify-refresh -->
    install:
      run: scripts/with-dev-env bun i

post-rewrite:
  commands:
# <!-- BEGIN develop-tools:lefthook:post-rewrite:graphify-refresh v1 sha256=4fc87be19bf008fe7473f52dfa06384008a462fb587fe05bb88038a3fab4cb00 -->
    graphify-refresh:
      run: |
        if [ "{1}" = amend ]; then
          exit 0
        fi
        refresher="$HOME/Develop/develop-meta/bin/graphify-refresh"
        if [ ! -x "$refresher" ]; then
          printf '%s\n' 'graphify-refresh: binary missing or not executable' >&2
        elif ! "$refresher" --repo-root .; then
          printf '%s\n' 'graphify-refresh: refresh failed' >&2
        fi
        true
# <!-- END develop-tools:lefthook:post-rewrite:graphify-refresh -->
    install:
      run: scripts/with-dev-env bun i

pre-commit:
  parallel: true
  commands:
# <!-- BEGIN develop-tools:lefthook:pre-commit:island-docs v1 sha256=534b22e17cacc1fc6b40f7c6e4f13769bef1e8ee7d54da685068929c6531cf9c -->
    island-docs:
      run: |
        saved_index_file="${GIT_INDEX_FILE:-}"
        for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done
        if [ -n "$saved_index_file" ]; then
          exec .develop-tools/resolve pre-commit develop-docs-check --staged --index-file "$saved_index_file"
        fi
        exec .develop-tools/resolve pre-commit develop-docs-check --staged
# <!-- END develop-tools:lefthook:pre-commit:island-docs -->
# <!-- BEGIN develop-tools:lefthook:pre-commit:develop-tools-version v1 sha256=a3b39c8086dd1d07b2310a82335ab40564604a2fd9940482ee6365296801b114 -->
    develop-tools-version:
      run: |
        if ! .develop-tools/resolve pre-commit develop-docs-check --check-local-version; then
          printf '%s\n' 'develop tools: 版を確認できません' >&2
        fi
        true
# <!-- END develop-tools:lefthook:pre-commit:develop-tools-version -->
# <!-- BEGIN develop-tools:lefthook:pre-commit:adr-structure v1 sha256=b4b851e9d520488b6b06ed28e9e355718381d778ee626d32fff0b29a4dd694c0 -->
    adr-structure:
      glob: "docs/adr/**"
      run: |
        saved_index_file="${GIT_INDEX_FILE:-}"
        for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done
        if [ -n "$saved_index_file" ]; then
          exec .develop-tools/resolve pre-commit check-staged-adr --index-file "$saved_index_file"
        fi
        exec .develop-tools/resolve pre-commit check-staged-adr
# <!-- END develop-tools:lefthook:pre-commit:adr-structure -->
# <!-- BEGIN develop-tools:lefthook:pre-commit:docs-structure v1 sha256=e239a04b5cfdc3fca5d65e80c0d7bdfcd1e324c422dcf987e432e928f0c790d6 -->
    docs-structure:
      glob: "{TODO.md,CHANGELOG.md}"
      run: |
        saved_index_file="${GIT_INDEX_FILE:-}"
        for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done
        if [ -n "$saved_index_file" ]; then
          exec .develop-tools/resolve pre-commit check-staged-docs --index-file "$saved_index_file"
        fi
        exec .develop-tools/resolve pre-commit check-staged-docs
# <!-- END develop-tools:lefthook:pre-commit:docs-structure -->
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact
    # staged のファイルだけを検査・整形する (501 と同じ)。ディレクトリ全体へ --write をかけると
    # 毎回全体を走査するうえ、別作業の未 staged の変更まで書き換えて stage_fixed で commit に入りうる。
    biome:
      glob: "{src,tests,scripts}/**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}"
      run: scripts/with-dev-env bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typescript:
      glob: "*.{ts,tsx}"
      run: scripts/with-dev-env bun run typecheck
    test:
      # `tests/` 配下だけ編集したコミット (例: feature テストの追加・修正のみ) でも
      # pre-commit でテストを走らせるため、glob には `tests/` も含める
      glob: "{src,tests}/**/*.{ts,tsx}"
      run: scripts/with-dev-env bun run scripts/run-related-tests.ts {staged_files}

# pre-push は版照合だけ。全テストと OpenSpec strict validation は main の CI で実行する。
pre-push:
  scripts:
# <!-- BEGIN develop-tools:lefthook:pre-push:check-release-version v1 sha256=e9a10c170a2331ecc94e9346f8fcdd05b104cebb55406cfc4fb0b6051d6a6475 -->
    check-release-version.sh:
      runner: sh
      use_stdin: true
# <!-- END develop-tools:lefthook:pre-push:check-release-version -->
