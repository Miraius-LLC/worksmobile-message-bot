<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="entity-model-title entity-model-desc">
    <title id="entity-model-title">LINE WORKS Bot conceptual entity model</title>
    <desc id="entity-model-desc">Bot, domain registration, channels, users, message targets, thirteen outbound message types, attachments, menus and eight callback event types, with separate process-local token and deduplication state. This wrapper has no persistent store.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="1600" height="1000" fill="#f5f5f5"/>

    <!-- Three zones keep conceptual resources distinct from process-local state. -->
    <rect x="40" y="48" width="1520" height="252" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <rect x="40" y="316" width="1520" height="344" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <rect x="40" y="676" width="544" height="220" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <rect x="592" y="676" width="968" height="220" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <text x="64" y="80" fill="#4f5d75" font-size="16" font-family="monospace" letter-spacing="2">LINE WORKS RESOURCES</text>
    <text x="64" y="348" fill="#4f5d75" font-size="16" font-family="monospace" letter-spacing="2">OUTBOUND CONTENT AND MENUS</text>
    <text x="64" y="708" fill="#4f5d75" font-size="16" font-family="monospace" letter-spacing="2">INBOUND EVENT</text>
    <text x="608" y="708" fill="#4f5d75" font-size="16" font-family="monospace" letter-spacing="2">PROCESS-LOCAL MEMORY</text>

    <!-- Orthogonal relations. Cardinalities describe API resources, not local tables. -->
    <line x1="304" y1="184" x2="376" y2="184" stroke="#4f5d75"/>
    <text x="312" y="172" fill="#4f5d75" font-size="16" font-family="monospace">1</text>
    <text x="332" y="172" fill="#4f5d75" font-size="16" font-family="monospace">0..*</text>
    <path d="M 304,152 H 332 Q 340,152 340,144 V 112 Q 340,104 348,104 H 824 Q 832,104 832,112 V 120" fill="none" stroke="#4f5d75"/>
    <text x="312" y="140" fill="#4f5d75" font-size="16" font-family="monospace">1</text>
    <text x="776" y="96" fill="#4f5d75" font-size="16" font-family="monospace">0..*</text>
    <path d="M 528,248 V 264 Q 528,272 536,272 H 1256 Q 1264,272 1264,264 V 248" fill="none" stroke="#4f5d75"/>
    <text x="540" y="264" fill="#4f5d75" font-size="16" font-family="monospace">1</text>
    <text x="1200" y="264" fill="#4f5d75" font-size="16" font-family="monospace">0..*</text>
    <line x1="1048" y1="184" x2="1112" y2="184" stroke="#4f5d75"/>
    <text x="1052" y="172" fill="#4f5d75" font-size="12" font-family="monospace">0..*</text>
    <text x="1084" y="172" fill="#4f5d75" font-size="12" font-family="monospace">1..*</text>

    <!-- Outbound request: one target union selects one endpoint for one send. -->
    <line x1="320" y1="484" x2="376" y2="484" stroke="#eb6c36"/>
    <text x="328" y="472" fill="#4f5d75" font-size="16" font-family="monospace">1</text>
    <text x="356" y="472" fill="#4f5d75" font-size="16" font-family="monospace">1</text>
    <line x1="872" y1="484" x2="944" y2="484" stroke="#4f5d75"/>
    <text x="880" y="472" fill="#4f5d75" font-size="16" font-family="monospace">1</text>
    <text x="904" y="472" fill="#4f5d75" font-size="12" font-family="monospace">0..*</text>
    <path d="M 280,868 V 876 Q 280,884 288,884 H 1304 Q 1312,884 1312,876 V 868" fill="none" stroke="#4f5d75"/>
    <text x="524" y="872" fill="#4f5d75" font-size="12" font-family="monospace">1 event</text>
    <text x="1020" y="872" fill="#4f5d75" font-size="12" font-family="monospace">0..1 key</text>

    <!-- Entity cards: fields are API identifiers or type discriminators. -->
    <g transform="translate(64 120)">
      <rect width="240" height="128" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">ENTITY</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Bot</text>
      <line x1="0" y1="60" x2="240" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="84" fill="#2d3142" font-size="16" font-family="monospace"># botId</text>
      <text x="16" y="108" fill="#4f5d75" font-size="16" font-family="monospace">callback settings</text>
    </g>
    <g transform="translate(376 120)">
      <rect width="304" height="128" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">ENTITY · REGISTRATION</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Bot domain registration</text>
      <line x1="0" y1="60" x2="304" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="84" fill="#2d3142" font-size="16" font-family="monospace">botId + domainId</text>
      <text x="16" y="108" fill="#4f5d75" font-size="16" font-family="monospace">visible / selected members</text>
    </g>
    <g transform="translate(744 120)">
      <rect width="304" height="128" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">ENTITY</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Channel · talk room</text>
      <line x1="0" y1="60" x2="304" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="84" fill="#2d3142" font-size="16" font-family="monospace"># channelId / domainId</text>
      <text x="16" y="108" fill="#4f5d75" font-size="16" font-family="monospace">members: userId[]</text>
    </g>
    <g transform="translate(1112 120)">
      <rect width="304" height="128" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">ENTITY</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">User · domain member</text>
      <line x1="0" y1="60" x2="304" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="84" fill="#2d3142" font-size="16" font-family="monospace"># userId</text>
      <text x="16" y="108" fill="#4f5d75" font-size="16" font-family="monospace">registered by domainId</text>
    </g>

    <g transform="translate(64 404)">
      <rect width="256" height="160" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="16" y="24" fill="#eb6c36" font-size="16" font-family="monospace">UNION · PER REQUEST</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">MessageTarget</text>
      <line x1="0" y1="60" x2="256" y2="60" stroke="#eb6c36"/>
      <text x="16" y="88" fill="#2d3142" font-size="16" font-family="monospace">channelId</text>
      <text x="16" y="112" fill="#4f5d75" font-size="16" font-family="monospace">OR userId</text>
      <text x="16" y="136" fill="#4f5d75" font-size="16" font-family="monospace">exactly one</text>
    </g>
    <g transform="translate(376 376)">
      <rect width="496" height="240" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">ENTITY · OUTBOUND</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Message · 13 types</text>
      <line x1="0" y1="60" x2="496" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="88" fill="#2d3142" font-size="16" font-family="monospace">text · sticker · image · file · audio · video</text>
      <text x="16" y="112" fill="#2d3142" font-size="16" font-family="monospace">location · link · button_template</text>
      <text x="16" y="136" fill="#2d3142" font-size="16" font-family="monospace">list_template · carousel · image_carousel · flex</text>
      <text x="16" y="184" fill="#4f5d75" font-size="16" font-family="monospace">POST /channels|users/:id/messages/type/:type</text>
      <text x="16" y="212" fill="#4f5d75" font-size="16" font-family="monospace">{ type, ...body }</text>
    </g>
    <g transform="translate(944 404)">
      <rect width="280" height="160" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">ENTITY · FILE HANDLE</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Attachment</text>
      <line x1="0" y1="60" x2="280" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="88" fill="#2d3142" font-size="16" font-family="monospace"># fileId</text>
      <text x="16" y="112" fill="#4f5d75" font-size="16" font-family="monospace">upload / download</text>
      <text x="16" y="136" fill="#4f5d75" font-size="16" font-family="monospace">optional in message body</text>
    </g>
    <g transform="translate(1248 380)">
      <rect width="280" height="120" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">BOT-SCOPED ENTITY</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Persistent menu</text>
      <line x1="0" y1="60" x2="280" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="88" fill="#2d3142" font-size="16" font-family="monospace">Bot 1 : menu 0..1</text>
      <text x="16" y="108" fill="#4f5d75" font-size="16" font-family="monospace">actions: 0..4</text>
    </g>
    <g transform="translate(1248 512)">
      <rect width="280" height="136" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">BOT-SCOPED ENTITY</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Rich menu</text>
      <line x1="0" y1="60" x2="280" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="84" fill="#2d3142" font-size="16" font-family="monospace"># richmenuId / areas[]</text>
      <text x="16" y="104" fill="#4f5d75" font-size="16" font-family="monospace">Bot 1 : menu 0..*</text>
      <text x="16" y="124" fill="#4f5d75" font-size="16" font-family="monospace">User 0..* : menu 0..1</text>
    </g>

    <g transform="translate(64 732)">
      <rect width="456" height="136" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">ENTITY · INBOUND</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Callback event · 8 types</text>
      <line x1="0" y1="60" x2="456" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="84" fill="#2d3142" font-size="16" font-family="monospace">message · postback · join · leave</text>
      <text x="16" y="104" fill="#2d3142" font-size="16" font-family="monospace">joined · left · begin · end</text>
      <text x="16" y="124" fill="#4f5d75" font-size="16" font-family="monospace">source: domainId + userId? + channelId?</text>
    </g>
    <g transform="translate(608 732)">
      <rect width="408" height="136" rx="6" fill="#fff" stroke="#4f5d75" stroke-dasharray="4 4"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">PROCESS-LOCAL STATE</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Server token cache</text>
      <line x1="0" y1="60" x2="408" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="84" fill="#2d3142" font-size="16" font-family="monospace">cached: 0..1 / expiresAt</text>
      <text x="16" y="108" fill="#4f5d75" font-size="16" font-family="monospace">inFlight: 0..1 promise · single-flight</text>
    </g>
    <g transform="translate(1096 732)">
      <rect width="432" height="136" rx="6" fill="#fff" stroke="#4f5d75" stroke-dasharray="4 4"/>
      <text x="16" y="24" fill="#4f5d75" font-size="16" font-family="monospace">PROCESS-LOCAL STATE</text>
      <text x="16" y="48" fill="#2d3142" font-size="20" font-weight="600" font-family="sans-serif">Callback dedup Map</text>
      <line x1="0" y1="60" x2="432" y2="60" stroke="#bfc0c0"/>
      <text x="16" y="84" fill="#2d3142" font-size="16" font-family="monospace">SHA-256(raw body) → expiry</text>
      <text x="16" y="108" fill="#4f5d75" font-size="16" font-family="monospace">5 min · not shared between instances</text>
    </g>

    <!-- Bottom legend is outside the diagram zones. -->
    <line x1="40" y1="920" x2="1560" y2="920" stroke="#bfc0c0"/>
    <text x="40" y="948" fill="#4f5d75" font-size="16" font-family="monospace">LEGEND</text>
    <text x="160" y="948" fill="#2d3142" font-size="20" font-family="sans-serif">永続ストアなし</text>
    <text x="344" y="948" fill="#4f5d75" font-size="16" font-family="monospace">Cards describe upstream API concepts; dashed cards are process-local memory.</text>
    <text x="344" y="972" fill="#4f5d75" font-size="16" font-family="monospace">1 / 0..1 / 0..* = cardinality at each endpoint. No local database or table is implied.</text>
  </svg>
