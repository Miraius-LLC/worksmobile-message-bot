commit-msg:
  commands:
    # attribution trailer は AGENTS.md §7.1 で禁止。harness の session 開始指示が
    # 毎回これを足すため、規約を読んでいても守り切れない (2026-09-09 に 49 件の違反)。
    # 規律ではなく機械で止める。正本は agent-room の lefthook.yml。
    forbidden-trailers:
      run: |
        if grep -qiE '^(Co-Authored-By|Claude-Session):' {1}; then
          echo "commit-msg: 禁止 trailer が含まれています (AGENTS.md §7.1)" >&2
          echo "  削除する行: Co-Authored-By: / Claude-Session: の両方" >&2
          grep -inE '^(Co-Authored-By|Claude-Session):' {1} | sed 's/^/  検出 /' >&2
          exit 1
        fi

post-merge:
  commands:
# <!-- BEGIN develop-meta:lefthook:post-merge:graphify-refresh v1 sha256=0b0949ab61236fe8c4a36cac738cd391ddd0f4e11600804093557645819cd1cd -->
    graphify-refresh:
      run: |
        refresher="$HOME/Develop/develop-meta/bin/graphify-refresh"
        if [ ! -x "$refresher" ]; then
          printf '%s\n' 'graphify-refresh: binary missing or not executable' >&2
        elif ! "$refresher" --repo-root .; then
          printf '%s\n' 'graphify-refresh: refresh failed' >&2
        fi
        true
# <!-- END develop-meta:lefthook:post-merge:graphify-refresh -->
    install:
      run: scripts/with-dev-env bun i

post-rewrite:
  commands:
# <!-- BEGIN develop-meta:lefthook:post-rewrite:graphify-refresh v1 sha256=4fc87be19bf008fe7473f52dfa06384008a462fb587fe05bb88038a3fab4cb00 -->
    graphify-refresh:
      run: |
        if [ "{1}" = amend ]; then
          exit 0
        fi
        refresher="$HOME/Develop/develop-meta/bin/graphify-refresh"
        if [ ! -x "$refresher" ]; then
          printf '%s\n' 'graphify-refresh: binary missing or not executable' >&2
        elif ! "$refresher" --repo-root .; then
          printf '%s\n' 'graphify-refresh: refresh failed' >&2
        fi
        true
# <!-- END develop-meta:lefthook:post-rewrite:graphify-refresh -->
    install:
      run: scripts/with-dev-env bun i

pre-commit:
  parallel: true
  commands:
# <!-- BEGIN develop-meta:lefthook:pre-commit:develop-tools-version v1 sha256=a5db45817bc82b4fad178e43de43a8aedb288f61698004f0fec614d3d5f0d9c6 -->
    develop-tools-version:
      run: |
        checker="$(command -v develop-docs-check 2>/dev/null || true)"
        if [ -z "$checker" ] && [ -x "$HOME/Develop/develop-meta/bin/develop-docs-check" ]; then
          checker="$HOME/Develop/develop-meta/bin/develop-docs-check"
        fi
        if [ -n "$checker" ]; then
          if ! "$checker" --check-local-version; then
            printf '%s\n' 'develop tools: 版を確認できません。~/Develop/develop-meta/bin/install-tools を実行してください' >&2
          fi
        fi
        true
# <!-- END develop-meta:lefthook:pre-commit:develop-tools-version -->
# <!-- BEGIN develop-meta:lefthook:pre-commit:adr-structure v1 sha256=d167fbee3c02a4c4a0ef9f0318379001e94cd1a141a07e6e0752129db9529054 -->
    adr-structure:
      glob: "docs/adr/**"
      run: |
        saved_index_file="${GIT_INDEX_FILE:-}"
        for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done
        if [ -n "$saved_index_file" ]; then
          exec scripts/with-dev-env bun run scripts/develop-tools/check-staged-adr.ts --index-file "$saved_index_file"
        fi
        exec scripts/with-dev-env bun run scripts/develop-tools/check-staged-adr.ts
# <!-- END develop-meta:lefthook:pre-commit:adr-structure -->
# <!-- BEGIN develop-meta:lefthook:pre-commit:docs-structure v1 sha256=80212fa612913168e27bd51958cba14192a462f1b481d4371ca0b12b99d0d264 -->
    docs-structure:
      glob: "{TODO.md,CHANGELOG.md}"
      run: |
        saved_index_file="${GIT_INDEX_FILE:-}"
        for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done
        if [ -n "$saved_index_file" ]; then
          exec scripts/with-dev-env bun run scripts/develop-tools/check-staged-docs.ts --index-file "$saved_index_file"
        fi
        exec scripts/with-dev-env bun run scripts/develop-tools/check-staged-docs.ts
# <!-- END develop-meta:lefthook:pre-commit:docs-structure -->
    gitleaks:
      run: gitleaks protect --staged --no-banner --redact
    # staged のファイルだけを検査・整形する (501 と同じ)。ディレクトリ全体へ --write をかけると
    # 毎回全体を走査するうえ、別作業の未 staged の変更まで書き換えて stage_fixed で commit に入りうる。
    biome:
      glob: "{src,tests,scripts}/**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}"
      run: scripts/with-dev-env bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typescript:
      glob: "*.{ts,tsx}"
      run: scripts/with-dev-env bunx tsc --noEmit
    test:
      # `tests/` 配下だけ編集したコミット (例: feature テストの追加・修正のみ) でも
      # pre-commit でテストを走らせるため、glob には `tests/` も含める
      glob: "{src,tests}/**/*.{ts,tsx}"
      run: scripts/with-dev-env bun run scripts/run-related-tests.ts {staged_files}

# pre-push では `bun test` を全件実行する (co-located unit + tests/ feature)。
# pre-commit は staged された本体に対応する関連テストしか拾わないため、
# テストヘルパや preload (src/test-helpers/setup.ts) 経路で壊れる失敗を逃しがち。
# push 前に全件走らせて main を緑に保つ。全件でも数秒なのでコストは無視できる。
pre-push:
  parallel: true
  commands:
    full-test:
      run: scripts/with-dev-env bun test
    openspec-validate:
      run: scripts/with-dev-env bun run spec:validate
