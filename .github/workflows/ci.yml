name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check + Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: ./scripts/ci-install.sh --frozen-lockfile
        env:
          SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}

      - name: Validate OpenSpec
        run: bun run spec:validate

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Biome lint / format check
        run: >-
          bunx biome check ./src ./tests ./scripts
          ci-config.test.ts ci-install.test.ts lockfile-config.test.ts
          wrangler-config.test.ts operations-config.test.ts
          openspec-config.test.ts openspec-adr-coverage.test.ts

      - name: Tests
        run: bun test

      - name: Wrangler dry run
        id: wrangler-dry-run
        env:
          WORKER_CUSTOM_DOMAIN: bot.example.com
          OAUTH_SCOPE: bot
        run: |
          bun scripts/create-wrangler-production-config.ts
          bunx wrangler deploy --config wrangler.production.json --dry-run

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-workers-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: ./scripts/ci-install.sh --frozen-lockfile
        env:
          SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}

      - name: Create production Wrangler config
        env:
          WORKER_CUSTOM_DOMAIN: ${{ vars.WORKER_CUSTOM_DOMAIN }}
          OAUTH_SCOPE: ${{ vars.OAUTH_SCOPE }}
        run: |
          test -n "$WORKER_CUSTOM_DOMAIN"
          bun scripts/create-wrangler-production-config.ts

      # wrangler-action は版を自前で決めるため、直書きすると package.json (= dry-run で
      # 検証した版) と割れる。install 済みの実体から引いて渡す。Renovate は workflow 内の
      # wranglerVersion を拾わないので、直書きのままだと次の更新で黙って割れる。
      - name: Resolve wrangler version
        id: wrangler
        run: |
          set -eu
          version="$(bunx wrangler --version | tail -1 | tr -d '\r')"
          # 版として読めない出力をそのまま action へ渡さない (壊れた値だと action が別版を install する)
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::wrangler の版を解決できませんでした: '${version}'"; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          packageManager: bun
          command: deploy --config wrangler.production.json --message "GitHub Actions ${{ github.sha }}"

      - name: Add deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo '### Cloudflare Workers deployment'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
