name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check + Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Resolve Bun version
        id: develop-bun-version
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          FIXED = re.compile(r"[0-9]+\.[0-9]+\.[0-9]+")
          def fail(message):
              sys.exit("develop-bun-version: " + message)
          declared = {}
          try:
              with open(".config/mise.toml", "rb") as handle:
                  tools = tomllib.load(handle).get("tools")
          except FileNotFoundError:
              pass
          except (OSError, tomllib.TOMLDecodeError) as error:
              fail(".config/mise.toml を読めない: %s" % error)
          else:
              value = tools.get("bun") if isinstance(tools, dict) else None
              if not isinstance(value, str) or not FIXED.fullmatch(value):
                  fail(".config/mise.toml の [tools].bun は固定した x.y.z の文字列にする")
              declared[".config/mise.toml"] = value
          try:
              with open(".tool-versions", encoding="utf-8") as handle:
                  lines = handle.read().splitlines()
          except FileNotFoundError:
              lines = []
          except (OSError, UnicodeDecodeError) as error:
              fail(".tool-versions を読めない: %s" % error)
          for line in lines:
              fields = line.split("#", 1)[0].split()
              if fields[:1] == ["bun"]:
                  if len(fields) != 2 or not FIXED.fullmatch(fields[1]):
                      fail(".tool-versions の bun は固定した x.y.z を 1 つだけ書く")
                  if ".tool-versions" in declared:
                      fail(".tool-versions に bun が複数ある")
                  declared[".tool-versions"] = fields[1]
          if not declared:
              fail("bun の版が .config/mise.toml にも .tool-versions にも無い")
          if len(set(declared.values())) != 1:
              fail("bun の版が食い違う: %r" % declared)
          open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write("version=%s\n" % next(iter(declared.values())))
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.develop-bun-version.outputs.version }}

      - name: Install dependencies
        run: ./scripts/ci-install.sh --frozen-lockfile

      - name: Validate OpenSpec
        run: bun run spec:validate

      - name: TypeScript type check
        run: bun run typecheck

      - name: Biome lint / format check
        run: bun run lint

      - name: Tests
        run: bun test

      - name: Wrangler dry run
        id: wrangler-dry-run
        env:
          WORKER_CUSTOM_DOMAIN: bot.example.com
          OAUTH_SCOPE: bot
        run: |
          bun scripts/create-wrangler-production-config.ts
          bunx wrangler deploy --config wrangler.production.json --dry-run

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-workers-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve Bun version
        id: develop-bun-version
        run: |
          python3 - <<'PY'
          import os, re, sys, tomllib
          FIXED = re.compile(r"[0-9]+\.[0-9]+\.[0-9]+")
          def fail(message):
              sys.exit("develop-bun-version: " + message)
          declared = {}
          try:
              with open(".config/mise.toml", "rb") as handle:
                  tools = tomllib.load(handle).get("tools")
          except FileNotFoundError:
              pass
          except (OSError, tomllib.TOMLDecodeError) as error:
              fail(".config/mise.toml を読めない: %s" % error)
          else:
              value = tools.get("bun") if isinstance(tools, dict) else None
              if not isinstance(value, str) or not FIXED.fullmatch(value):
                  fail(".config/mise.toml の [tools].bun は固定した x.y.z の文字列にする")
              declared[".config/mise.toml"] = value
          try:
              with open(".tool-versions", encoding="utf-8") as handle:
                  lines = handle.read().splitlines()
          except FileNotFoundError:
              lines = []
          except (OSError, UnicodeDecodeError) as error:
              fail(".tool-versions を読めない: %s" % error)
          for line in lines:
              fields = line.split("#", 1)[0].split()
              if fields[:1] == ["bun"]:
                  if len(fields) != 2 or not FIXED.fullmatch(fields[1]):
                      fail(".tool-versions の bun は固定した x.y.z を 1 つだけ書く")
                  if ".tool-versions" in declared:
                      fail(".tool-versions に bun が複数ある")
                  declared[".tool-versions"] = fields[1]
          if not declared:
              fail("bun の版が .config/mise.toml にも .tool-versions にも無い")
          if len(set(declared.values())) != 1:
              fail("bun の版が食い違う: %r" % declared)
          open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write("version=%s\n" % next(iter(declared.values())))
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.develop-bun-version.outputs.version }}

      - name: Install dependencies
        run: ./scripts/ci-install.sh --frozen-lockfile

      - name: Create production Wrangler config
        env:
          WORKER_CUSTOM_DOMAIN: ${{ vars.WORKER_CUSTOM_DOMAIN }}
          OAUTH_SCOPE: ${{ vars.OAUTH_SCOPE }}
        run: |
          test -n "$WORKER_CUSTOM_DOMAIN"
          bun scripts/create-wrangler-production-config.ts

      # wrangler-action は版を自前で決めるため、直書きすると package.json (= dry-run で
      # 検証した版) と割れる。install 済みの実体から引いて渡す。Renovate は workflow 内の
      # wranglerVersion を拾わないので、直書きのままだと次の更新で黙って割れる。
      - name: Resolve wrangler version
        id: wrangler
        run: |
          set -eu
          version="$(bunx wrangler --version | tail -1 | tr -d '\r')"
          # 版として読めない出力をそのまま action へ渡さない (壊れた値だと action が別版を install する)
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::wrangler の版を解決できませんでした: '${version}'"; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          packageManager: bun
          command: deploy --config wrangler.production.json --message "GitHub Actions ${{ github.sha }}"

      - name: Add deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo '### Cloudflare Workers deployment'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
