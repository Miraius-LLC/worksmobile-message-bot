name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Type check + Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            sleepSeconds=$((attempt * 30))
            echo "::warning::bun install failed on attempt ${attempt}; retrying in ${sleepSeconds}s..."
            sleep "$sleepSeconds"
          done
          bun install --frozen-lockfile
        env:
          SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Biome lint / format check
        run: bunx biome check ./src ./tests ./scripts

      - name: Tests
        run: bun test
