# <!-- BEGIN develop-tools:ci-develop:standard v1 sha256=fdc25dab6c0c8b75606d953a278b20be999b5d16109fe5236cc4c50e21e3288d -->
name: CI (develop)

# develop の push と PR で走らせる軽い CI の標準の区画。develop-sync が .develop-tools.json の ci 宣言から作る。
# 区画の中は手で直さず、宣言を直して develop-sync --ci-develop で配り直す。repo 固有の job は END の目印の後ろに書く。
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# PR の更新だけを集約する。push は各 run の検査を残す。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      - name: gitleaks
        run: |
          set -eu
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${checksum}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          export PATH="$RUNNER_TEMP:$PATH"
          gitleaks git . --redact --no-banner --log-opts=--all
      # 切り替え前の形: develop-meta の private Release から .develop-tools.json の版で固定した道具を入れ、変わった文書を見る。
      # App の secret が要るので fork の PR は扱わない（切り替えで解消）。
      - name: Create release reader token
        id: develop-tools-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEVELOP_TOOLS_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOP_TOOLS_APP_PRIVATE_KEY }}
          owner: fujimogn
          repositories: develop-meta
          permission-contents: read
      - name: Install develop tools
        uses: fujimogn/develop-tools-action@ed47dcda36c8a05054fdbb342ed1ca0d37fd94aa # v1.0.2
        with:
          token: ${{ steps.develop-tools-token.outputs.token }}
      - name: Check changed documentation
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          fi
          develop-docs-check --range "$BASE_SHA" "$HEAD_SHA"

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      - run: bun run ci:install
        working-directory: '.'
      - run: bun run lint
        working-directory: '.'
      - run: bun run typecheck
        working-directory: '.'
      - run: bun run test:fast
        working-directory: '.'
# <!-- END develop-tools:ci-develop:standard -->
