name: Develop tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create release reader token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        id: develop-tools-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEVELOP_TOOLS_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOP_TOOLS_APP_PRIVATE_KEY }}
          owner: fujimogn
          repositories: develop-meta
          permission-contents: read
      - name: Install develop tools
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: fujimogn/develop-tools-action@ed47dcda36c8a05054fdbb342ed1ca0d37fd94aa # v1.0.2
        with:
          token: ${{ steps.develop-tools-token.outputs.token }}
      - name: Smoke installed binaries
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          develop-docs-check --version
          command -v check-staged-docs
          command -v check-staged-adr
          command -v develop-secrets
      - name: Check changed documentation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          fi
          develop-docs-check --range "$BASE_SHA" "$HEAD_SHA"
      - name: Explain skipped fork PR check
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Skipping develop-docs-check for fork PR because the private release token is unavailable."
