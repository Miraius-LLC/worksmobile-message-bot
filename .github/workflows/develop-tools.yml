name: Develop tools

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install develop tools
        uses: fujimogn/develop-tools-action@f2ec0193a6e9c880e3a0823f48538fa694a8e5dd # v0.3.7
      - name: Smoke installed binaries
        run: |
          develop-docs-check --version
          command -v check-staged-docs
          command -v check-staged-adr
          command -v develop-secrets
      - name: Check documentation
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            develop-docs-check --tracked
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            fi
            develop-docs-check --range "$BASE_SHA" "$HEAD_SHA"
          fi
